<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How Open Seat works: solo students and a group each tell their own agent their terms; the agents pair newcomers, reshape the game, privately ask the sub, and everyone confirms at once before names unlock</title>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9z" fill="#2a1e29"/></marker>
    <marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9z" fill="#a8431f"/></marker>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .zone { font-size: 11px; letter-spacing: .14em; fill: #8a7d84; font-weight: 600; }
      .name { font-size: 15px; font-weight: 600; fill: #2a1e29; }
      .quote { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 15px; fill: #655960; }
      .step { font-size: 15px; font-weight: 600; fill: #2a1e29; }
      .desc { font-size: 13.5px; fill: #655960; }
      .note { font-size: 13px; fill: #8a7d84; }
    </style>
  </defs>

  <rect width="1200" height="660" fill="#f3eee5"/>

  <text x="60" y="76" class="serif" font-size="36" fill="#2a1e29">open seat. <tspan font-style="italic" font-size="26" fill="#a8431f">four requests, none possible alone</tspan></text>
  <text x="60" y="108" font-size="15" fill="#655960">Court 2 needs exactly two more. Each person tells only their own agent. The agents find the one arrangement that works.</text>

  <text x="60" y="160" class="zone">EVERYONE AND THEIR OWN AGENT</text>
  <text x="560" y="160" class="zone">ONE ARRANGEMENT</text>
  <text x="945" y="160" class="zone">EVERYONE GETS</text>

  <!-- people -->
  <g>
    <circle cx="82" cy="215" r="20" fill="#f0dfd3"/><text x="82" y="222" class="serif" font-size="20" fill="#a8431f" text-anchor="middle">a</text>
    <text x="116" y="209" class="name">Alex · solo</text>
    <text x="116" y="230" class="quote">“beginner. not as the only new one”</text>

    <circle cx="82" cy="305" r="20" fill="#f0dfd3"/><text x="82" y="312" class="serif" font-size="20" fill="#a8431f" text-anchor="middle">j</text>
    <text x="116" y="299" class="name">Jordan · solo</text>
    <text x="116" y="320" class="quote">“hard stop at 2:20 for chem lab”</text>

    <circle cx="82" cy="395" r="20" fill="#2a1e29"/><text x="82" y="402" class="serif" font-size="20" fill="#f3eee5" text-anchor="middle">s</text>
    <text x="116" y="389" class="name">Sam · court 2</text>
    <text x="116" y="410" class="quote">“3v3 now. 4v4 if exactly 2 join”</text>

    <circle cx="82" cy="485" r="20" fill="#2a1e29"/><text x="82" y="492" class="serif" font-size="20" fill="#f3eee5" text-anchor="middle">d</text>
    <text x="116" y="479" class="name">Dave · sideline</text>
    <text x="116" y="500" class="quote">“happy to sub in”</text>
  </g>

  <!-- agents -->
  <g>
    <circle cx="455" cy="215" r="7" fill="#2a1e29"/>
    <circle cx="455" cy="305" r="7" fill="#2a1e29"/>
    <circle cx="455" cy="395" r="7" fill="#2a1e29"/>
    <circle cx="455" cy="485" r="7" fill="#a8431f"/>
  </g>
  <g stroke="#c4b6ab" stroke-width="1.2" stroke-dasharray="2 4">
    <path d="M418 215H446"/><path d="M385 305H446"/><path d="M398 395H446"/><path d="M290 485H446"/>
  </g>

  <g stroke="#2a1e29" stroke-width="1.3" fill="none">
    <path d="M462 215C505 215 505 340 538 345"/>
    <path d="M462 305C500 305 505 343 538 345"/>
    <path d="M462 395C500 395 505 347 538 345"/>
    <path d="M462 485C505 485 505 350 538 345"/>
  </g>
  <path d="M536 345H546" stroke="#2a1e29" stroke-width="1.3" marker-end="url(#ink)"/>
  <!-- the private sub ask goes to Dave only -->
  <path d="M548 452C520 452 505 476 468 484" stroke="#a8431f" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#rust)"/>

  <text x="455" y="540" class="note" text-anchor="middle">only what, when and</text>
  <text x="455" y="559" class="note" text-anchor="middle">the conditions cross</text>

  <!-- the arrangement -->
  <line x1="574" y1="200" x2="574" y2="512" stroke="#dbd1c4" stroke-width="1.2"/>
  <g>
    <circle cx="574" cy="200" r="12" fill="#f3eee5" stroke="#2a1e29" stroke-width="1.3"/><text x="574" y="205" font-size="12" fill="#2a1e29" text-anchor="middle">1</text>
    <text x="600" y="197" class="step">Alone, nothing works</text>
    <text x="600" y="216" class="desc">one newcomer breaks 3v3; Alex won’t go solo</text>

    <circle cx="574" cy="278" r="12" fill="#f3eee5" stroke="#2a1e29" stroke-width="1.3"/><text x="574" y="283" font-size="12" fill="#2a1e29" text-anchor="middle">2</text>
    <text x="600" y="275" class="step">The agents pair up</text>
    <text x="600" y="294" class="desc">Alex + Jordan: neither is the only new one</text>

    <circle cx="574" cy="356" r="12" fill="#f3eee5" stroke="#2a1e29" stroke-width="1.3"/><text x="574" y="361" font-size="12" fill="#2a1e29" text-anchor="middle">3</text>
    <text x="600" y="353" class="step">The game reshapes</text>
    <text x="600" y="372" class="desc">3v3 half court → 4v4 full court at 1:35</text>

    <circle cx="574" cy="434" r="12" fill="#a8431f"/><text x="574" y="439" font-size="12" fill="#f3eee5" text-anchor="middle">4</text>
    <text x="600" y="431" class="step" fill="#a8431f">One private ask</text>
    <text x="600" y="450" class="desc">only Dave: “sub in at 2:20?”</text>

    <circle cx="574" cy="512" r="12" fill="#f3eee5" stroke="#2a1e29" stroke-width="1.3"/><text x="574" y="517" font-size="12" fill="#2a1e29" text-anchor="middle">5</text>
    <text x="600" y="509" class="step">Everyone confirms at once</text>
    <text x="600" y="528" class="desc">then names and the court unlock</text>
  </g>

  <!-- what everyone gets -->
  <path d="M800 509H900C922 509 922 290 937 290" stroke="#2a1e29" stroke-width="1.3" fill="none" marker-end="url(#ink)"/>
  <rect x="945" y="196" width="215" height="176" rx="16" fill="#2a1e29"/>
  <text x="967" y="226" font-size="12" fill="#b3a3ad">a DM to Alex</text>
  <text x="967" y="260" class="serif" font-size="19" fill="#f3eee5">✳ A seat is open</text>
  <text x="967" y="286" class="serif" font-size="19" fill="#f3eee5">for you. 4v4 at 1:35,</text>
  <text x="967" y="312" class="serif" font-size="19" fill="#f3eee5">one other newcomer.</text>
  <text x="967" y="350" font-size="12.5" fill="#b3a3ad">names unlock when all confirm</text>

  <text x="945" y="418" class="zone" style="fill:#a8431f">NEVER LEAVES AN AGENT</text>
  <g class="desc">
    <text x="945" y="446">your words</text>
    <text x="945" y="470">your level, or that you’re nervous</text>
    <text x="945" y="494">why you have to leave early</text>
    <text x="945" y="518">who passed</text>
  </g>

  <line x1="60" y1="596" x2="1140" y2="596" stroke="#dbd1c4" stroke-width="1"/>
  <text x="60" y="626" class="note">Any Discord server: groups mention the bot to post open seats, anyone DMs it their terms. Claude reads both into structured terms; plain code decides every arrangement.</text>
</svg>
